name: Construir datos y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Pruebas automáticas
        run: python -m pytest -q
      - name: Construir la base de datos
        run: python tools/construir_datos.py --estricto
      - name: Armar el sitio
        run: |
          mkdir -p _sitio/datos
          cp index.html _sitio/
          touch _sitio/.nojekyll
          cp -r assets _sitio/
          [ -d fotos ] && cp -r fotos _sitio/ || true
          cp datos/historico.js datos/historico.csv datos/auditoria_codigos.csv datos/informe_validacion.md _sitio/datos/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
